
{# templates/recruitment/base_recruitment.html #}
{% extends "tracker/staff/base.html" %}

{% block header_navigation %}
    {{ block.super }}
    {% include "recruitment/includes/rec_nav.html" %}
{% endblock %}

{% block content %}

<style>
/* =========================================================
   GIANT STRIDES — RECRUITMENT DESIGN SYSTEM
   ========================================================= */

:root {
    --gs-primary: #1740c8;
    --gs-primary-dark: #12349f;
    --gs-navy: #142d55;
    --gs-background: #f5f7fb;
    --gs-surface: #ffffff;
    --gs-border: #e5eaf1;
    --gs-border-strong: #d5dce7;
    --gs-text: #182232;
    --gs-muted: #758196;
    --gs-success: #15803d;
    --gs-success-bg: #dcfce7;
    --gs-warning: #a16207;
    --gs-warning-bg: #fef3c7;
    --gs-info: #0369a1;
    --gs-info-bg: #e0f2fe;
    --gs-danger: #b91c1c;
    --gs-danger-bg: #fee2e2;
    --gs-radius: 12px;
    --gs-shadow: 0 2px 8px rgba(15, 23, 42, 0.045);
    --gs-shadow-hover: 0 8px 24px rgba(15, 23, 42, 0.08);
}

/* Base container */

.gs-container,
.gs-container * {
    box-sizing: border-box;
}

.gs-container {
    width: min(100% - 40px, 1440px);
    margin: 30px auto;
    color: var(--gs-text);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
}

/* Typography */

.gs-container h1,
.gs-container h2,
.gs-container h3,
.gs-container h4 {
    color: var(--gs-text);
    line-height: 1.3;
}

.gs-container h1 {
    font-size: clamp(1.4rem, 2vw, 1.85rem);
    font-weight: 750;
    letter-spacing: -0.045em;
    margin: 0;
}

.gs-container h2 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0;
}

.gs-container h3 {
    font-size: 1rem;
    font-weight: 700;
    margin: 0;
}

.gs-subtitle {
    color: var(--gs-muted);
    font-size: 0.88rem;
    margin-top: 5px;
}

/* Page header */

.gs-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    margin-bottom: 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--gs-border);
}

.gs-header-content {
    min-width: 0;
}

.gs-header-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

/* Breadcrumbs */

.gs-breadcrumbs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
    color: var(--gs-muted);
    font-size: 0.8rem;
}

.gs-breadcrumbs a {
    color: var(--gs-primary);
    text-decoration: none;
}

.gs-breadcrumbs a:hover {
    text-decoration: underline;
}

/* Cards */

.gs-card {
    background: var(--gs-surface);
    border: 1px solid var(--gs-border);
    border-radius: var(--gs-radius);
    box-shadow: var(--gs-shadow);
    margin-bottom: 22px;
    overflow: hidden;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
}

.gs-card:hover {
    border-color: var(--gs-border-strong);
}

.gs-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 17px 20px;
    background: #fbfcfe;
    border-bottom: 1px solid var(--gs-border);
}

.gs-card-header p {
    margin: 4px 0 0;
    color: var(--gs-muted);
    font-size: 0.82rem;
}

.gs-card-body {
    padding: 22px;
}

.gs-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 15px 20px;
    background: #fbfcfe;
    border-top: 1px solid var(--gs-border);
}

/* Dashboard statistics */

.gs-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}

.gs-stat-card {
    background: var(--gs-surface);
    border: 1px solid var(--gs-border);
    border-radius: var(--gs-radius);
    padding: 19px;
    box-shadow: var(--gs-shadow);
    min-width: 0;
}

.gs-stat-label {
    color: var(--gs-muted);
    font-size: 0.82rem;
    font-weight: 600;
}

.gs-stat-value {
    display: block;
    margin-top: 8px;
    color: var(--gs-navy);
    font-size: 1.8rem;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -0.04em;
}

.gs-stat-description {
    margin-top: 7px;
    color: var(--gs-muted);
    font-size: 0.76rem;
}

/* Tables */

.gs-table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--gs-border);
    border-radius: 9px;
    -webkit-overflow-scrolling: touch;
}

.gs-table {
    width: 100%;
    min-width: 680px;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.86rem;
}

.gs-table th {
    padding: 13px 16px;
    background: #f8fafc;
    color: #526078;
    text-align: left;
    white-space: nowrap;
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.035em;
    border-bottom: 1px solid var(--gs-border);
}

.gs-table td {
    padding: 14px 16px;
    color: #344054;
    vertical-align: middle;
    border-bottom: 1px solid #edf0f5;
}

.gs-table tbody tr:last-child td {
    border-bottom: none;
}

.gs-table tbody tr {
    transition: background 0.15s ease;
}

.gs-table tbody tr:hover {
    background: #f8faff;
}

.gs-table a {
    color: var(--gs-primary);
    font-weight: 600;
    text-decoration: none;
}

.gs-table a:hover {
    text-decoration: underline;
}

/* Buttons */

.gs-btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    min-height: 36px;
    padding: 8px 14px;
    border: 1px solid transparent;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 650;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease,
                color 0.18s ease, transform 0.18s ease;
}

.gs-btn:hover {
    transform: translateY(-1px);
}

.gs-btn-primary {
    background: var(--gs-primary);
    color: #fff;
}

.gs-btn-primary:hover {
    background: var(--gs-primary-dark);
    color: #fff;
}

.gs-btn-success {
    background: var(--gs-success);
    color: #fff;
}

.gs-btn-success:hover {
    background: #166534;
    color: #fff;
}

.gs-btn-outline {
    background: #fff;
    color: #344054;
    border-color: var(--gs-border-strong);
}

.gs-btn-outline:hover {
    background: #f8fafc;
    border-color: #aeb9ca;
}

.gs-btn-danger {
    background: var(--gs-danger-bg);
    color: var(--gs-danger);
    border-color: #fecaca;
}

.gs-btn-danger:hover {
    background: #fecaca;
    color: #991b1b;
}

.gs-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
}

/* Tags and status badges */

.gs-tag {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 0.74rem;
    font-weight: 700;
    white-space: nowrap;
}

.gs-tag-filled {
    background: var(--gs-success-bg);
    color: #166534;
}

.gs-tag-open {
    background: var(--gs-warning-bg);
    color: #92400e;
}

.gs-tag-info {
    background: var(--gs-info-bg);
    color: #075985;
}

.gs-tag-danger {
    background: var(--gs-danger-bg);
    color: #991b1b;
}

.gs-tag-neutral {
    background: #f1f5f9;
    color: #475569;
}

/* Forms */

.gs-form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 17px;
}

.gs-form-group label {
    color: #344054;
    font-size: 0.82rem;
    font-weight: 650;
}

.gs-form-control,
.gs-container input:not([type="checkbox"]):not([type="radio"]),
.gs-container select,
.gs-container textarea {
    width: 100%;
    min-height: 40px;
    padding: 9px 12px;
    border: 1px solid var(--gs-border-strong);
    border-radius: 7px;
    background: #fff;
    color: var(--gs-text);
    font-family: inherit;
    font-size: 0.87rem;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

.gs-container textarea {
    min-height: 110px;
    resize: vertical;
}

.gs-form-control:focus,
.gs-container input:focus,
.gs-container select:focus,
.gs-container textarea:focus {
    border-color: var(--gs-primary);
    box-shadow: 0 0 0 3px rgba(23, 64, 200, 0.10);
}

.gs-form-help {
    color: var(--gs-muted);
    font-size: 0.76rem;
}

/* Form layouts */

.gs-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 18px;
}

.gs-form-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0 18px;
}

/* Filters and toolbars */

.gs-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
}

.gs-toolbar-left,
.gs-toolbar-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
}

.gs-filter-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px;
    margin-bottom: 18px;
    background: #f8fafc;
    border: 1px solid var(--gs-border);
    border-radius: 9px;
}

/* Alerts */

.gs-alert {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 13px 15px;
    margin-bottom: 17px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: 0.85rem;
}

.gs-alert-success {
    background: var(--gs-success-bg);
    color: #166534;
    border-color: #bbf7d0;
}

.gs-alert-warning {
    background: var(--gs-warning-bg);
    color: #92400e;
    border-color: #fde68a;
}

.gs-alert-danger {
    background: var(--gs-danger-bg);
    color: #991b1b;
    border-color: #fecaca;
}

.gs-alert-info {
    background: var(--gs-info-bg);
    color: #075985;
    border-color: #bae6fd;
}

/* Empty states */

.gs-empty-state {
    padding: 45px 20px;
    text-align: center;
}

.gs-empty-state h3 {
    margin-bottom: 7px;
}

.gs-empty-state p {
    max-width: 430px;
    margin: 0 auto 17px;
    color: var(--gs-muted);
    font-size: 0.86rem;
}

/* Pagination */

.gs-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 20px;
}

.gs-pagination a,
.gs-pagination span {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--gs-border);
    border-radius: 6px;
    background: #fff;
    color: #344054;
    font-size: 0.8rem;
    text-decoration: none;
}

.gs-pagination .current {
    background: var(--gs-primary);
    border-color: var(--gs-primary);
    color: #fff;
}

/* Utility classes */

.gs-text-muted {
    color: var(--gs-muted);
}

.gs-text-primary {
    color: var(--gs-primary);
}

.gs-text-success {
    color: var(--gs-success);
}

.gs-text-danger {
    color: var(--gs-danger);
}

.gs-fw-bold {
    font-weight: 700;
}

.gs-flex {
    display: flex;
    align-items: center;
    gap: 10px;
}

.gs-flex-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.gs-mt-1 { margin-top: 8px; }
.gs-mt-2 { margin-top: 16px; }
.gs-mb-1 { margin-bottom: 8px; }
.gs-mb-2 { margin-bottom: 16px; }

/* Accessibility */

.gs-container a:focus-visible,
.gs-container button:focus-visible {
    outline: 3px solid rgba(23, 64, 200, 0.35);
    outline-offset: 2px;
}

/* Responsive layout */

@media (max-width: 1000px) {
    .gs-stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .gs-form-grid-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 700px) {
    .gs-container {
        width: min(100% - 28px, 100%);
        margin: 20px auto;
        font-size: 13px;
    }

    .gs-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 13px;
        margin-bottom: 20px;
        padding-bottom: 16px;
    }

    .gs-header-actions {
        width: 100%;
    }

    .gs-header-actions .gs-btn {
        flex: 1;
    }

    .gs-card {
        margin-bottom: 16px;
        border-radius: 10px;
    }

    .gs-card-header {
        padding: 14px 15px;
    }

    .gs-card-body {
        padding: 16px;
    }

    .gs-card-footer {
        padding: 13px 15px;
    }

    .gs-stats-grid {
        gap: 10px;
    }

    .gs-stat-card {
        padding: 14px;
    }

    .gs-stat-value {
        font-size: 1.5rem;
    }

    .gs-form-grid,
    .gs-form-grid-3 {
        grid-template-columns: 1fr;
    }

    .gs-toolbar {
        align-items: stretch;
        flex-direction: column;
    }

    .gs-toolbar-left,
    .gs-toolbar-right {
        width: 100%;
    }

    .gs-toolbar .gs-btn {
        flex: 1;
    }

    .gs-filter-bar {
        align-items: stretch;
        flex-direction: column;
    }

    .gs-filter-bar > * {
        width: 100%;
    }

    .gs-pagination {
        gap: 5px;
    }
}

@media (max-width: 400px) {
    .gs-stats-grid {
        grid-template-columns: 1fr;
    }

    .gs-header-actions {
        flex-direction: column;
    }

    .gs-header-actions .gs-btn {
        width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {
    .gs-container *,
    .gs-container *::before,
    .gs-container *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}
</style>

<div class="gs-container">
    {% block recruitment_content %}{% endblock %}
</div>

{% endblock %}
